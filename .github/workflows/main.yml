
name: Build TUXIRO WARP ME (VST3)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S TuxiroWarpMe -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1

          if (-not $vst3) {
            throw "No se ha encontrado el plugin VST3"
          }

          Compress-Archive -Path $vst3.FullName -DestinationPath "dist/TUXIRO-WARP-ME-Windows-VST3.zip" -Force

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: TUXIRO-WARP-ME-Windows-VST3
          path: dist/TUXIRO-WARP-ME-Windows-VST3.zip
